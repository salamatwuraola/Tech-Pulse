kind = "web"
previewPath = "/"
title = "AI News Digest"
version = "1.0.0"
id = "artifacts/news-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22315

[services.development]
run = "pnpm --filter @workspace/news-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/news-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/news-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22315"
BASE_PATH = "/"
